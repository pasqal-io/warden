version: '3.9'
services:
  # Update this to the name of the service you want to work with in your docker-compose.yml file
  # warden-rhel-8-8:
  #   # Uncomment if you want to override the service's Dockerfile to one in the .devcontainer 
  #   # folder. Note that the path of the Dockerfile and context is relative to the *primary* 
  #   # docker-compose.yml file (the first in the devcontainer.json "dockerComposeFile"
  #   # array). The sample below assumes your primary file is in the root of your project.
  #   #
  #   build:
  #     context: ..
  #     dockerfile: .devcontainer/rhel8.Dockerfile
  #   volumes:
  #     # Update this to wherever you want VS Code to mount the folder of your project
  #     - ../:/workspaces/warden:cached

  #   # Uncomment the next four lines if you will use a ptrace-based debugger like C++, Go, and Rust.
  #   # cap_add:
  #   #   - SYS_PTRACE
  #   # security_opt:
  #   #   - seccomp:unconfined

  #   # Overrides default command so things don't shut down after the process ends.
  #   command: sleep infinity
 

  warden-rocky-8:
    build:
      context: ..
      dockerfile: .devcontainer/rocky8.Dockerfile
    volumes:
      - ../:/workspaces/warden:cached
      - warden-rocky-8-venv:/workspaces/warden/.venv
      - warden-rocky-8-poetry:/workspaces/warden/.poetry
    command: >
      /bin/sh -c "mkdir -p /workspaces/warden/.venv /workspaces/warden/.poetry
      && chown -R 1000:1000 /workspaces/warden/.venv /workspaces/warden/.poetry
      && sleep infinity"
 

  warden-rocky-9:
    build:
      context: ..
      dockerfile: .devcontainer/rocky9.Dockerfile
    volumes:
      - ../:/workspaces/warden:cached
      - warden-rocky-9-venv:/workspaces/warden/.venv
      - warden-rocky-9-poetry:/workspaces/warden/.poetry
    command: >
      /bin/sh -c "mkdir -p /workspaces/warden/.venv /workspaces/warden/.poetry
      && chown -R 1000:1000 /workspaces/warden/.venv /workspaces/warden/.poetry
      && sleep infinity"
 
volumes:
  warden-rocky-8-venv:
  warden-rocky-8-poetry:
  warden-rocky-9-venv:
  warden-rocky-9-poetry:
